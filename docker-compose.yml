services:
  app:
    build: .
    ports:
      - "8000:8000"
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      CCR_OLLAMA_BASE_URL: http://host.docker.internal:11434
      CCR_ROOT: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ccr_data:/app/data

  langfuse-db:
    image: postgres:16-alpine
    profiles: ["obs"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data

  langfuse:
    image: langfuse/langfuse:2
    profiles: ["obs"]
    depends_on:
      - langfuse-db
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: change-me
      SALT: change-me
      NEXTAUTH_URL: http://localhost:3000

volumes:
  ccr_data:
  langfuse_db:
